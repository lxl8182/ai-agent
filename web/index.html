<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏攻略智能体</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
我            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            color: #555;
        }

        .response {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .response.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .response-title {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .search-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-link {
            padding: 8px 16px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .search-link:hover {
            background: #667eea;
            color: white;
        }

        .response-content {
            color: #555;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border-left-color: #e74c3c;
            color: #c0392b;
        }

        .examples {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .examples h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .example-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-tag {
            padding: 6px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-tag:hover {
            background: #667eea;
            color: white;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85em;
            color: #999;
        }

        .status.connected {
            color: #27ae60;
        }

        .status.disconnected {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 游戏攻略智能体</h1>
        <p class="subtitle">智能搜索最新游戏攻略，自动打开浏览器查看</p>

        <div class="input-group">
            <input 
                type="text" 
                id="questionInput" 
                placeholder="例如：原神 雷电将军怎么培养"
                autocomplete="off"
            >
            <button id="searchBtn" onclick="handleSearch()">
                🔍 搜索攻略
            </button>
        </div>

        <div class="options">
            <div class="option">
                <input type="checkbox" id="autoOpenBrowser" checked>
                <label for="autoOpenBrowser">自动在浏览器中打开搜索结果</label>
            </div>
            <div class="option">
                <input type="checkbox" id="useSmartChat" checked>
                <label for="useSmartChat">使用智能搜索（推荐）</label>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在搜索最新攻略...</p>
        </div>

        <div class="response" id="response">
            <div class="response-header">
                <span class="response-title">📋 搜索结果</span>
                <div class="search-links" id="searchLinks"></div>
            </div>
            <div class="response-content" id="responseContent"></div>
        </div>

        <div class="examples">
            <h3>💡 试试这些问题：</h3>
            <div class="example-tags">
                <span class="example-tag" onclick="setExample('原神 雷电将军怎么培养')">原神 雷电将军</span>
                <span class="example-tag" onclick="setExample('黑神话悟空 虎先锋怎么打')">黑神话 虎先锋</span>
                <span class="example-tag" onclick="setExample('塞尔达传说 王国之泪 隐藏神庙')">塞尔达 神庙</span>
                <span class="example-tag" onclick="setExample('王者荣耀 S35赛季上分英雄')">王者上分英雄</span>
                <span class="example-tag" onclick="setExample('崩坏星穹铁道 黄泉配队')">星铁 黄泉</span>
                <span class="example-tag" onclick="setExample('艾尔登法环 女武神打法')">法环 女武神</span>
            </div>
        </div>

        <div class="status" id="status">
            检查服务器连接...
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        
        // 检查服务器连接
        async function checkConnection() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    document.getElementById('status').textContent = '✅ 服务器已连接';
                    document.getElementById('status').className = 'status connected';
                } else {
                    throw new Error('Server error');
                }
            } catch (error) {
                document.getElementById('status').textContent = '❌ 服务器未连接，请先运行: go run cmd/server/main.go';
                document.getElementById('status').className = 'status disconnected';
            }
        }

        // 设置示例问题
        function setExample(question) {
            document.getElementById('questionInput').value = question;
            document.getElementById('questionInput').focus();
        }

        // 处理搜索
        async function handleSearch() {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) {
                alert('请输入问题！');
                return;
            }

            const autoOpen = document.getElementById('autoOpenBrowser').checked;
            const useSmart = document.getElementById('useSmartChat').checked;

            // 显示加载状态
            document.getElementById('loading').classList.add('show');
            document.getElementById('response').classList.remove('show');
            document.getElementById('searchBtn').disabled = true;

            try {
                // 构建搜索 URL（用于直接在浏览器中打开）
                const searchUrl = `https://www.bing.com/search?q=${encodeURIComponent(question + ' 攻略')}`;
                
                // 如果勾选了自动打开浏览器，先打开搜索页面
                if (autoOpen) {
                    window.open(searchUrl, '_blank');
                }

                // 同时调用 API 获取智能回答
                const endpoint = useSmart ? '/api/v1/smart-chat' : '/api/v1/simple-chat';
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: question
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // 显示结果
                displayResult(data, searchUrl);

            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('searchBtn').disabled = false;
            }
        }

        // 显示结果
        function displayResult(data, searchUrl) {
            const responseDiv = document.getElementById('response');
            const contentDiv = document.getElementById('responseContent');
            const linksDiv = document.getElementById('searchLinks');

            if (data.success) {
                contentDiv.textContent = data.data;
                linksDiv.innerHTML = `
                    <a href="${searchUrl}" target="_blank" class="search-link">
                        🔗 在浏览器中查看
                    </a>
                `;
                responseDiv.className = 'response show';
            } else {
                showError(data.error || '未知错误');
            }
        }

        // 显示错误
        function showError(message) {
            const responseDiv = document.getElementById('response');
            const contentDiv = document.getElementById('responseContent');
            const linksDiv = document.getElementById('searchLinks');

            contentDiv.textContent = `错误: ${message}`;
            linksDiv.innerHTML = '';
            responseDiv.className = 'response show error';
        }

        // 回车键搜索
        document.getElementById('questionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        // 页面加载时检查连接
        checkConnection();
        
        // 每 10 秒检查一次连接
        setInterval(checkConnection, 10000);
    </script>
</body>
</html>
