<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 游戏攻略助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 20px 20px 0 0;
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
            border-bottom: 1px solid #e0e0e0;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-indicator.connected {
            background: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .status-indicator.disconnected {
            background: #f44336;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            display: flex;
            justify-content: flex-end;
        }

        .user-message .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 18px;
            border-radius: 18px 18px 4px 18px;
            max-width: 70%;
            line-height: 1.6;
        }

        .bot-message {
            display: flex;
            justify-content: flex-start;
        }

        .bot-message .bubble {
            background: white;
            border: 2px solid #e0e0e0;
            color: #333;
            padding: 12px 18px;
            border-radius: 18px 18px 18px 4px;
            max-width: 70%;
            line-height: 1.6;
        }

        .bot-message.searching .bubble {
            background: #fff3cd;
            border-color: #ffc107;
        }

        .bot-message.success .bubble {
            background: #d4edda;
            border-color: #28a745;
        }

        .input-area {
            padding: 20px 30px;
            background: white;
            border-top: 2px solid #f0f0f0;
            border-radius: 0 0 20px 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            color: #555;
            font-size: 0.9em;
        }

        .typing-indicator {
            display: inline-block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .header {
                border-radius: 0;
            }

            .input-wrapper {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 AI 游戏攻略助手</h1>
            <p>智能对话 + 自动搜索游戏攻略</p>
        </div>

        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">正在连接服务器...</span>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message bot-message">
                <div class="bubble">
                    👋 你好！我是 AI 游戏攻略助手。<br><br>
                    🎯 我可以：<br>
                    • 回答你的任何问题（接入 LLM）<br>
                    • 检测游戏相关问题并自动搜索攻略<br>
                    • 在浏览器中打开最新的游戏资讯<br><br>
                    💡 试试问我：<br>
                    • "原神 雷电将军怎么培养"<br>
                    • "黑神话悟空 虎先锋打法"<br>
                    • "今天天气怎么样"
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="输入你的问题..."
                    autocomplete="off"
                >
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>

            <div class="options">
                <div class="option">
                    <input type="checkbox" id="autoSearch" checked>
                    <label for="autoSearch">检测到游戏时自动打开浏览器搜索</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="newTab" checked>
                    <label for="newTab">在新标签页打开</label>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        let isConnected = false;

        // 常见游戏名称列表
        const gameNames = [
            '原神', 'genshin impact',
            '崩坏星穹铁道', '崩坏', '星穹铁道', 'honkai star rail',
            '黑神话悟空', '黑神话', 'black myth',
            '王者荣耀', '王者',
            '和平精英', '吃鸡',
            '阴阳师',
            '明日方舟', 'arknights',
            '幻兽帕鲁', 'palworld',
            '塞尔达传说', 'zelda', '王国之泪',
            '英雄联盟', 'lol', 'league of legends',
            'minecraft', '我的世界', 'mc',
            'gta', '侠盗猎车手',
            '艾尔登法环', 'elden ring', '老头环',
            '博德之门', 'baldurs gate',
            '最终幻想', 'final fantasy', 'ff',
            '宝可梦', 'pokemon',
            '马里奥', 'mario',
            '刺客信条', 'assassins creed',
            '巫师', 'witcher',
            '赛博朋克', 'cyberpunk',
            '守望先锋', 'overwatch',
            'dota', 'dota2',
            'cs', 'csgo',
            '魔兽世界', 'wow',
            '绝地求生', 'pubg',
            '鸣潮',
            '绝区零',
            '燕云十六声',
            '洛克王国',
            '洛克王国手游',
            '奥奇传说',
            '赛尔号',
            '奥拉星',
            '摩尔庄园',
            '奥比岛'
        ];

        // 检查服务器连接
        async function checkConnection() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    isConnected = true;
                    document.getElementById('statusIndicator').className = 'status-indicator connected';
                    document.getElementById('statusText').textContent = '✅ 服务器已连接';
                } else {
                    throw new Error('Server error');
                }
            } catch (error) {
                isConnected = false;
                document.getElementById('statusIndicator').className = 'status-indicator disconnected';
                document.getElementById('statusText').textContent = '❌ 服务器未连接，请启动后端服务';
            }
        }

        // 添加消息到聊天区
        function addMessage(text, isUser = false, extraClass = '') {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'} ${extraClass}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = text;
            
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            return messageDiv;
        }

        // 显示打字指示器
        function showTyping() {
            const chatArea = document.getElementById('chatArea');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message';
            typingDiv.id = 'typingIndicator';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            
            typingDiv.appendChild(bubble);
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 移除打字指示器
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) {
                typing.remove();
            }
        }

        // 检测游戏名称
        function detectGame(text) {
            const lowerText = text.toLowerCase();
            for (const game of gameNames) {
                if (lowerText.includes(game.toLowerCase())) {
                    return game;
                }
            }
            return null;
        }

        // 构建搜索 URL
        function buildSearchUrl(query) {
            const encodedQuery = encodeURIComponent(query + ' 攻略');
            return `https://www.bing.com/search?q=${encodedQuery}`;
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const text = input.value.trim();
            
            if (!text) {
                return;
            }

            // 禁用输入
            input.disabled = true;
            sendBtn.disabled = true;

            // 添加用户消息
            addMessage(text, true);
            input.value = '';

            // 检测游戏
            const detectedGame = detectGame(text);
            const autoSearch = document.getElementById('autoSearch').checked;

            if (detectedGame && autoSearch) {
                // 检测到游戏，先显示提示
                addMessage(`🔍 检测到游戏"${detectedGame}"，正在调用 AI 回答并准备搜索...`, false, 'searching');
                
                // 打开浏览器搜索
                setTimeout(() => {
                    const searchUrl = buildSearchUrl(text);
                    const newTab = document.getElementById('newTab').checked;
                    
                    if (newTab) {
                        window.open(searchUrl, '_blank');
                    } else {
                        window.location.href = searchUrl;
                    }
                }, 500);
            }

            // 显示打字指示器
            showTyping();

            try {
                // 调用后端 LLM API
                const response = await fetch(`${API_BASE}/api/v1/smart-chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: text
                    })
                });

                hideTyping();

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    // 显示 AI 回答
                    const responseClass = detectedGame ? 'success' : '';
                    addMessage(data.data, false, responseClass);
                    
                    if (detectedGame) {
                        addMessage(`✅ 已在浏览器中打开"${detectedGame}"的搜索结果！`, false);
                    }
                } else {
                    throw new Error(data.error || 'Unknown error');
                }

            } catch (error) {
                hideTyping();
                addMessage(`❌ 错误: ${error.message}<br><br>请确保后端服务正在运行。`, false);
            } finally {
                // 恢复输入
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // 回车键发送
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 页面加载时检查连接
        checkConnection();
        
        // 每 5 秒检查一次连接
        setInterval(checkConnection, 5000);

        // 聚焦输入框
        window.onload = function() {
            document.getElementById('userInput').focus();
        };
    </script>
</body>
</html>
