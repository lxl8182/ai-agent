<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 游戏攻略助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 20px 20px 0 0;
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
            border-bottom: 1px solid #e0e0e0;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-indicator.connected {
            background: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .status-indicator.disconnected {
            background: #f44336;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            display: flex;
            justify-content: flex-end;
        }

        .user-message .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 18px;
            border-radius: 18px 18px 4px 18px;
            max-width: 70%;
            line-height: 1.6;
        }

        .bot-message {
            display: flex;
            justify-content: flex-start;
        }

        .bot-message .bubble {
            background: white;
            border: 2px solid #e0e0e0;
            color: #333;
            padding: 12px 18px;
            border-radius: 18px 18px 18px 4px;
            max-width: 70%;
            line-height: 1.6;
        }

        /* Markdown 样式 */
        .bot-message .bubble h1,
        .bot-message .bubble h2,
        .bot-message .bubble h3 {
            margin: 10px 0 5px 0;
            color: #667eea;
        }

        .bot-message .bubble p {
            margin: 5px 0;
        }

        .bot-message .bubble ul,
        .bot-message .bubble ol {
            margin: 5px 0;
            padding-left: 20px;
        }

        .bot-message .bubble li {
            margin: 3px 0;
        }

        .bot-message .bubble code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .bot-message .bubble pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .bot-message .bubble pre code {
            background: none;
            padding: 0;
        }

        .bot-message .bubble blockquote {
            border-left: 3px solid #667eea;
            padding-left: 10px;
            margin: 10px 0;
            color: #666;
        }

        .bot-message .bubble strong {
            color: #667eea;
            font-weight: bold;
        }

        .bot-message .bubble a {
            color: #667eea;
            text-decoration: none;
        }

        .bot-message .bubble a:hover {
            text-decoration: underline;
        }

        .bot-message.searching .bubble {
            background: #fff3cd;
            border-color: #ffc107;
        }

        .bot-message.success .bubble {
            background: #d4edda;
            border-color: #28a745;
        }

        .input-area {
            padding: 20px 30px;
            background: white;
            border-top: 2px solid #f0f0f0;
            border-radius: 0 0 20px 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            color: #555;
            font-size: 0.9em;
        }

        .typing-indicator {
            display: inline-block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .header {
                border-radius: 0;
            }

            .input-wrapper {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 AI 游戏攻略助手</h1>
            <p>智能对话 + 自动搜索游戏攻略</p>
        </div>

        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">正在连接服务器...</span>
            <button onclick="exportConversation()" style="margin-left: auto; padding: 6px 12px; background: #4caf50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 8px;">📥 导出对话</button>
            <button onclick="clearConversationHistory()" style="padding: 6px 12px; background: #f44336; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">🗑️ 清空对话</button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message bot-message">
                <div class="bubble">
                    👋 你好！我是 AI 游戏攻略助手。<br><br>
                    🎯 我可以：<br>
                    • 回答你的任何问题（接入 LLM）<br>
                    • 检测游戏相关问题并自动搜索攻略<br>
                    • 在浏览器中打开最新的游戏资讯<br><br>
                    💡 试试问我：<br>
                    • "原神 雷电将军怎么培养"<br>
                    • "黑神话悟空 虎先锋打法"<br>
                    • "今天天气怎么样"
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="输入你的问题..."
                    autocomplete="off"
                    maxlength="500"
                >
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>

            <div class="options">
                <div class="option">
                    <input type="checkbox" id="autoSearch" checked>
                    <label for="autoSearch">检测到游戏时自动打开浏览器搜索</label>
                </div>
                <div class="option">
                    <button onclick="toggleGameList()" style="padding: 8px 16px; font-size: 14px;">🎮 管理游戏列表</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏列表管理弹窗 -->
    <div id="gameListModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; border-radius: 15px; padding: 30px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; color: #333;">🎮 游戏列表管理</h2>
                <button onclick="toggleGameList()" style="background: #f44336; padding: 8px 16px; font-size: 14px;">✕ 关闭</button>
            </div>

            <div style="margin-bottom: 20px;">
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="text" id="newGameInput" placeholder="输入新游戏名称..." style="flex: 1; padding: 10px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                    <button onclick="addGame()" style="padding: 10px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">➕ 添加</button>
                </div>
                <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; font-size: 13px; color: #666;">
                    💡 提示：添加后立即可用，无需刷新页面。数据保存在浏览器本地存储中。
                </div>
            </div>

            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: #555; font-size: 16px;">当前游戏列表 (<span id="gameCount">0</span> 个)</h3>
                <button onclick="resetGameList()" style="padding: 6px 12px; background: #ff9800; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">🔄 重置为默认</button>
            </div>

            <div id="gameListContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;">
                <!-- 游戏列表将在这里动态生成 -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';
        let isConnected = false;
        
        // 对话历史记录
        let conversationHistory = [];
        
        // 从 localStorage 加载对话历史
        function loadConversationHistory() {
            const saved = localStorage.getItem('conversationHistory');
            if (saved) {
                try {
                    conversationHistory = JSON.parse(saved);
                    // 恢复之前的对话到界面
                    conversationHistory.forEach(msg => {
                        addMessage(msg.content, msg.role === 'user', '');
                    });
                } catch (e) {
                    conversationHistory = [];
                }
            }
        }
        
        // 保存对话历史到 localStorage
        function saveConversationHistory() {
            // 只保留最近 50 条消息
            if (conversationHistory.length > 50) {
                conversationHistory = conversationHistory.slice(-50);
            }
            localStorage.setItem('conversationHistory', JSON.stringify(conversationHistory));
        }
        
        // 清空对话历史
        function clearConversationHistory() {
            if (confirm('确定要清空所有对话记录吗？')) {
                conversationHistory = [];
                localStorage.removeItem('conversationHistory');
                // 清空聊天区域，只保留欢迎消息
                const chatArea = document.getElementById('chatArea');
                chatArea.innerHTML = `
                    <div class="message bot-message">
                        <div class="bubble">
                            👋 你好！我是 AI 游戏攻略助手。<br><br>
                            🎯 我可以：<br>
                            • 回答你的任何问题（接入 LLM）<br>
                            • 检测游戏相关问题并自动打开浏览器搜索<br>
                            • 提供结构化的游戏攻略建议<br><br>
                            💡 试试问我：<br>
                            • "原神 雷电将军怎么培养"<br>
                            • "黑神话悟空 虎先锋打法"<br>
                            • "今天天气怎么样"
                        </div>
                    </div>
                `;
            }
        }
        
        // 导出对话为 Markdown 文件
        function exportConversation() {
            if (conversationHistory.length === 0) {
                alert('当前没有对话记录可导出！');
                return;
            }
            
            let markdown = '# AI 游戏攻略助手 - 对话记录\n\n';
            markdown += `导出时间: ${new Date().toLocaleString('zh-CN')}\n\n`;
            markdown += '---\n\n';
            
            conversationHistory.forEach((msg, index) => {
                const role = msg.role === 'user' ? '👤 用户' : '🤖 AI';
                const time = new Date(msg.timestamp).toLocaleString('zh-CN');
                markdown += `### ${role} (${time})\n\n`;
                markdown += `${msg.content}\n\n`;
                if (index < conversationHistory.length - 1) {
                    markdown += '---\n\n';
                }
            });
            
            const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `对话记录_${new Date().getTime()}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 默认游戏名称列表
        const defaultGameNames = [
            '原神', 'genshin impact',
            '崩坏星穹铁道', '崩坏', '星穹铁道', 'honkai star rail',
            '黑神话悟空', '黑神话', 'black myth',
            '王者荣耀', '王者',
            '和平精英', '吃鸡',
            '阴阳师',
            '明日方舟', 'arknights',
            '幻兽帕鲁', 'palworld',
            '塞尔达传说', 'zelda', '王国之泪',
            '英雄联盟', 'lol', 'league of legends',
            'minecraft', '我的世界', 'mc',
            'gta', '侠盗猎车手',
            '艾尔登法环', 'elden ring', '老头环',
            '博德之门', 'baldurs gate',
            '最终幻想', 'final fantasy', 'ff',
            '宝可梦', 'pokemon',
            '马里奥', 'mario',
            '刺客信条', 'assassins creed',
            '巫师', 'witcher',
            '赛博朋克', 'cyberpunk',
            '守望先锋', 'overwatch',
            'dota', 'dota2',
            'cs', 'csgo',
            '魔兽世界', 'wow',
            '绝地求生', 'pubg',
            '鸣潮',
            '绝区零',
            '燕云十六声',
            '洛克王国',
            '洛克王国手游',
            '奥奇传说',
            '赛尔号',
            '奥拉星',
            '摩尔庄园',
            '奥比岛'
        ];

        // 从 localStorage 加载游戏列表，如果没有则使用默认
        let gameNames = [];
        function loadGameList() {
            const saved = localStorage.getItem('gameNames');
            if (saved) {
                try {
                    gameNames = JSON.parse(saved);
                } catch (e) {
                    gameNames = [...defaultGameNames];
                }
            } else {
                gameNames = [...defaultGameNames];
            }
        }

        // 保存游戏列表到 localStorage
        function saveGameList() {
            localStorage.setItem('gameNames', JSON.stringify(gameNames));
        }

        // 初始化时加载游戏列表
        loadGameList();

        // 检查服务器连接
        async function checkConnection() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    isConnected = true;
                    document.getElementById('statusIndicator').className = 'status-indicator connected';
                    document.getElementById('statusText').textContent = '✅ 服务器已连接';
                } else {
                    throw new Error('Server error');
                }
            } catch (error) {
                isConnected = false;
                document.getElementById('statusIndicator').className = 'status-indicator disconnected';
                document.getElementById('statusText').textContent = '❌ 服务器未连接，请启动后端服务';
            }
        }

        // 添加消息到聊天区
        function addMessage(text, isUser = false, extraClass = '') {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'} ${extraClass}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            // 如果是机器人消息，使用 marked 解析 Markdown
            if (!isUser && typeof marked !== 'undefined') {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.innerHTML = text;
            }
            
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            // 保存到对话历史
            conversationHistory.push({
                role: isUser ? 'user' : 'assistant',
                content: text,
                timestamp: new Date().toISOString()
            });
            saveConversationHistory();
            
            return messageDiv;
        }

        // 显示打字指示器
        function showTyping() {
            const chatArea = document.getElementById('chatArea');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message';
            typingDiv.id = 'typingIndicator';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            
            typingDiv.appendChild(bubble);
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 移除打字指示器
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) {
                typing.remove();
            }
        }

        // 检测游戏名称
        function detectGame(text) {
            const lowerText = text.toLowerCase();
            for (const game of gameNames) {
                if (lowerText.includes(game.toLowerCase())) {
                    return game;
                }
            }
            return null;
        }

        // 构建搜索 URL
        function buildSearchUrl(query) {
            const encodedQuery = encodeURIComponent(query + ' 攻略');
            return `https://www.bing.com/search?q=${encodedQuery}`;
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const text = input.value.trim();
            
            if (!text) {
                return;
            }

            // 禁用输入
            input.disabled = true;
            sendBtn.disabled = true;

            // 添加用户消息
            addMessage(text, true);
            input.value = '';

            // 检测游戏
            const detectedGame = detectGame(text);
            const autoSearch = document.getElementById('autoSearch').checked;

            if (detectedGame && autoSearch) {
                // 检测到游戏，先打开浏览器搜索
                const searchUrl = buildSearchUrl(text);
                window.open(searchUrl, '_blank');
                
                addMessage(`🌐 已在浏览器中打开"${detectedGame}"的搜索结果！<br><br>💡 同时，我将基于我的知识为你提供一些建议：`, false, 'success');
            }

            // 显示打字指示器
            showTyping();

            try {
                // 构建消息历史（包含当前消息）
                const messages = [
                    ...conversationHistory.slice(-10).map(msg => ({
                        role: msg.role,
                        content: msg.content
                    })),
                    { role: 'user', content: text }
                ];

                // 调用后端 LLM API，发送完整的对话历史
                const response = await fetch(`${API_BASE}/api/v1/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: messages  // 发送完整的历史记录
                    })
                });

                hideTyping();

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    addMessage(data.data, false);
                } else {
                    throw new Error(data.error || 'Unknown error');
                }

            } catch (error) {
                hideTyping();
                
                // 如果是网络错误，提供重试选项
                if (error.message.includes('fetch') || error.message.includes('Network')) {
                    const retryDiv = document.createElement('div');
                    retryDiv.className = 'message bot-message';
                    retryDiv.innerHTML = `
                        <div class="bubble" style="background: #fff3cd; border-color: #ffc107;">
                            ❌ 网络连接失败<br><br>
                            <button onclick="retryLastMessage('${text.replace(/'/g, "\\'")}')" 
                                    style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">
                                🔄 重试
                            </button>
                        </div>
                    `;
                    chatArea.appendChild(retryDiv);
                    chatArea.scrollTop = chatArea.scrollHeight;
                } else {
                    addMessage(`❌ 错误: ${error.message}<br><br>请确保后端服务正在运行。`, false);
                }
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // 回车键发送
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 重试最后一次消息
        let lastFailedMessage = '';
        function retryLastMessage(message) {
            lastFailedMessage = message;
            document.getElementById('userInput').value = message;
            sendMessage();
        }

        // 页面加载时检查连接
        checkConnection();
        
        // 加载对话历史
        loadConversationHistory();
        
        // 每 5 秒检查一次连接
        setInterval(checkConnection, 5000);

        // 聚焦输入框
        window.onload = function() {
            document.getElementById('userInput').focus();
        };

        // ========== 游戏列表管理功能 ==========

        // 切换游戏列表弹窗
        function toggleGameList() {
            const modal = document.getElementById('gameListModal');
            if (modal.style.display === 'none' || modal.style.display === '') {
                modal.style.display = 'flex';
                renderGameList();
            } else {
                modal.style.display = 'none';
            }
        }

        // 渲染游戏列表
        function renderGameList() {
            const container = document.getElementById('gameListContainer');
            const countElement = document.getElementById('gameCount');
            
            container.innerHTML = '';
            countElement.textContent = gameNames.length;

            gameNames.forEach((game, index) => {
                const gameCard = document.createElement('div');
                gameCard.style.cssText = `
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    padding: 12px 15px;
                    border-radius: 8px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    font-size: 14px;
                    animation: fadeIn 0.3s ease-in;
                `;
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = game;
                nameSpan.style.flex = '1';
                
                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '✕';
                deleteBtn.style.cssText = `
                    background: rgba(255,255,255,0.3);
                    border: none;
                    color: white;
                    width: 24px;
                    height: 24px;
                    border-radius: 50%;
                    cursor: pointer;
                    font-size: 12px;
                    margin-left: 8px;
                    transition: all 0.2s;
                `;
                deleteBtn.onmouseover = () => deleteBtn.style.background = 'rgba(255,255,255,0.5)';
                deleteBtn.onmouseout = () => deleteBtn.style.background = 'rgba(255,255,255,0.3)';
                deleteBtn.onclick = () => removeGame(index);
                
                gameCard.appendChild(nameSpan);
                gameCard.appendChild(deleteBtn);
                container.appendChild(gameCard);
            });
        }

        // 添加游戏
        function addGame() {
            const input = document.getElementById('newGameInput');
            const gameName = input.value.trim();
            
            if (!gameName) {
                alert('请输入游戏名称！');
                return;
            }

            // 检查是否已存在
            if (gameNames.some(g => g.toLowerCase() === gameName.toLowerCase())) {
                alert('该游戏已存在于列表中！');
                return;
            }

            gameNames.push(gameName);
            saveGameList();
            renderGameList();
            input.value = '';
            input.focus();
        }

        // 删除游戏
        function removeGame(index) {
            if (confirm(`确定要删除 "${gameNames[index]}" 吗？`)) {
                gameNames.splice(index, 1);
                saveGameList();
                renderGameList();
            }
        }

        // 重置为默认列表
        function resetGameList() {
            if (confirm('确定要重置为默认游戏列表吗？这将清除所有自定义添加的游戏。')) {
                gameNames = [...defaultGameNames];
                saveGameList();
                renderGameList();
            }
        }

        // 回车键添加游戏
        document.addEventListener('DOMContentLoaded', function() {
            const newGameInput = document.getElementById('newGameInput');
            if (newGameInput) {
                newGameInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        addGame();
                    }
                });
            }
        });
    </script>
</body>
</html>
